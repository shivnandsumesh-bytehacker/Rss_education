<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Dodger</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        canvas { background: #334155; border: 2px solid #38bdf8; border-radius: 8px; }
        .info { margin-bottom: 10px; font-size: 1.2rem; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="info">Score: <span id="score">0</span></div>
    <canvas id="game" width="300" height="450"></canvas>
    <a href="index.html">← Back to Hub</a>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let player = { x: 130, y: 380, w: 40, h: 60, speed: 5 };
        let obstacles = [];
        let score = 0;
        let frame = 0;
        let gameOver = false;
        let keys = {};

        document.addEventListener("keydown", (e) => { keys[e.key] = true; if (gameOver) resetGame(); });
        document.addEventListener("keyup", (e) => { keys[e.key] = false; });

        // Touch controls for mobile
        canvas.addEventListener("touchstart", (e) => {
            if (gameOver) { resetGame(); return; }
            let touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            if (touchX < canvas.width / 2) player.x -= 30;
            else player.x += 30;
        });

        function resetGame() {
            player.x = 130;
            obstacles = [];
            score = 0;
            frame = 0;
            gameOver = false;
            document.getElementById("score").innerText = score;
            loop();
        }

        function loop() {
            if (gameOver) return;

            frame++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Controls
            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) player.x -= player.speed;
            if ((keys["ArrowRight"] || keys["d"]) && player.x + player.w < canvas.width) player.x += player.speed;

            // Draw Road Lines
            ctx.strokeStyle = "#ffffff";
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.moveTo(150, (frame * 4) % 40 - 40);
            ctx.lineTo(150, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Player Car
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Spawn Obstacles
            if (frame % 60 === 0) {
                let obsX = Math.random() * (canvas.width - 40);
                obstacles.push({ x: obsX, y: -60, w: 40, h: 60, speed: 3 + Math.floor(score / 5) });
            }

            // Move and draw obstacles
            ctx.fillStyle = "#ef4444";
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.y += obs.speed;

                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

                // Collision Check
                if (
                    player.x < obs.x + obs.w &&
                    player.x + player.w > obs.x &&
                    player.y < obs.y + obs.h &&
                    player.y + player.h > obs.y
                ) {
                    gameOver = true;
                }

                // Dodged obstacle & award coin
                if (obs.y > canvas.height && !obs.passed) {
                    obs.passed = true;
                    score++;
                    document.getElementById("score").innerText = score;
                    if (window.Arcade && Arcade.addCoins) Arcade.addCoins(1);
                }
            }

            // Clean up off-screen obstacles
            obstacles = obstacles.filter(obs => obs.y <= canvas.height + 60);

            if (!gameOver) {
                requestAnimationFrame(loop);
            } else {
                ctx.fillStyle = "white";
                ctx.font = "18px sans-serif";
                ctx.fillText("Game Over! Press Key to Restart", 20, canvas.height / 2);
            }
        }

        loop();
    </script>
</body>
</html>
