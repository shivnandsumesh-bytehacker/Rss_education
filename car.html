<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Car Runner</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; background: #222; color: white; font-family: sans-serif; text-align: center; }
        canvas { background: #333; border: 2px solid #fff; display: block; margin: 10px auto; }
        .ui { font-size: 16px; margin: 10px; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; background: #4CAF50; color: white; border: none; border-radius: 8px; }
        .shop { margin-top: 15px; }
        .shop-btn { background: #FF9800; padding: 10px 20px; font-size: 14px; }
        a { color: #00BCD4; text-decoration: none; font-size: 18px; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>🚗 Car Upgrade Runner</h2>
    <div class="ui">
        Coins: <span id="coins">0</span> | Best: <span id="highScore">0</span>m
    </div>
    <canvas id="canvas" width="300" height="350"></canvas>

    <div class="controls">
        <button onclick="moveLeft()">⬅️ Left</button>
        <button onclick="moveRight()">Right ➡️</button>
    </div>

    <div class="shop">
        <button class="shop-btn" onclick="buySpeed()">⚡ Buy Speed (+1) - 10 Coins</button>
    </div>

    <p><a href="index.html">⬅️ Back to Game Hub</a></p>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let car = { x: 130, y: 280, width: 40, height: 60, speed: 5 };
let obstacles = [];
let coins = parseInt(localStorage.getItem("car_coins")) || 0;
let highScore = parseInt(localStorage.getItem("car_highScore")) || 0;
let score = 0;
let speedLevel = parseInt(localStorage.getItem("car_speedLevel")) || 1;

document.getElementById("coins").innerText = coins;
document.getElementById("highScore").innerText = highScore;

function moveLeft() { if (car.x > 10) car.x -= 40; }
function moveRight() { if (car.x < 250) car.x += 40; }

function buySpeed() {
    if (coins >= 10) {
        coins -= 10;
        car.speed += 1;
        speedLevel++;
        localStorage.setItem("car_coins", coins);
        localStorage.setItem("car_speedLevel", speedLevel);
        document.getElementById("coins").innerText = coins;
        alert("Speed Upgraded!");
    } else {
        alert("Not enough coins!");
    }
}

function update() {
    score++;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem("car_highScore", highScore);
        document.getElementById("highScore").innerText = highScore;
    }

    if (Math.random() < 0.03) {
        obstacles.push({ x: Math.floor(Math.random() * 6) * 45 + 10, y: -60, width: 35, height: 50 });
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].y += car.speed;

        // Collision check
        if (car.x < obstacles[i].x + obstacles[i].width &&
            car.x + car.width > obstacles[i].x &&
            car.y < obstacles[i].y + obstacles[i].height &&
            car.y + car.height > obstacles[i].y) {
            
            coins += Math.floor(score / 10);
            localStorage.setItem("car_coins", coins);
            document.getElementById("coins").innerText = coins;
            alert("Crash! You earned " + Math.floor(score / 10) + " coins.");
            score = 0;
            obstacles = [];
            car.x = 130;
        }

        if (obstacles[i].y > canvas.height) obstacles.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Player Car
    ctx.fillStyle = "#00BCD4";
    ctx.fillRect(car.x, car.y, car.width, car.height);

    // Obstacles
    ctx.fillStyle = "#FF5252";
    obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.width, o.height));
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
