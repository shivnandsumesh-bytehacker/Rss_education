<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(3, 90px); gap: 10px; margin: 20px 0; }
        .cell { width: 90px; height: 90px; background: #1e293b; border: 2px solid #38bdf8; border-radius: 8px; font-size: 2.5rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .cell.x { color: #38bdf8; }
        .cell.o { color: #ef4444; }
        .info { font-size: 1.2rem; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="info" id="status">Your Turn (X)</div>
    <div class="grid" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>
    <button onclick="resetGame()">Reset Board</button>
    <a href="index.html">← Back to Hub</a>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;
        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];

        function makeMove(index) {
            if (board[index] !== "" || !gameActive) return;

            board[index] = "X";
            render();

            if (checkWin("X")) {
                document.getElementById("status").innerText = "You Win!";
                gameActive = false;
                if (window.Arcade && Arcade.addCoins) Arcade.addCoins(3);
                return;
            }

            if (board.every(cell => cell !== "")) {
                document.getElementById("status").innerText = "It's a Tie!";
                gameActive = false;
                if (window.Arcade && Arcade.addCoins) Arcade.addCoins(1);
                return;
            }

            document.getElementById("status").innerText = "AI is thinking...";
            gameActive = false;
            setTimeout(aiMove, 400);
        }

        function aiMove() {
            let emptyIndices = board.map((val, idx) => val === "" ? idx : null).filter(v => v !== null);
            if (emptyIndices.length === 0) return;

            let randomIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            board[randomIndex] = "O";
            render();

            if (checkWin("O")) {
                document.getElementById("status").innerText = "AI Wins!";
                gameActive = false;
                return;
            }

            if (board.every(cell => cell !== "")) {
                document.getElementById("status").innerText = "It's a Tie!";
                gameActive = false;
                if (window.Arcade && Arcade.addCoins) Arcade.addCoins(1);
                return;
            }

            document.getElementById("status").innerText = "Your Turn (X)";
            gameActive = true;
        }

        function checkWin(player) {
            return winPatterns.some(pattern => pattern.every(index => board[index] === player));
        }

        function render() {
            const cells = document.querySelectorAll(".cell");
            cells.forEach((cell, index) => {
                cell.innerText = board[index];
                cell.className = "cell " + board[index].toLowerCase();
            });
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            document.getElementById("status").innerText = "Your Turn (X)";
            render();
        }
    </script>
</body>
</html>
