<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Catch</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        canvas { background: #1e293b; border: 2px solid #38bdf8; border-radius: 8px; }
        .info { margin-bottom: 10px; font-size: 1.2rem; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="info">Score: <span id="score">0</span> | Target Color: <span id="target" style="font-weight: bold;">RED</span></div>
    <canvas id="game" width="320" height="450"></canvas>
    <a href="index.html">← Back to Hub</a>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const COLORS = [
            { name: "RED", hex: "#ef4444" },
            { name: "BLUE", hex: "#3b82f6" },
            { name: "GREEN", hex: "#22c55e" },
            { name: "YELLOW", hex: "#eab308" }
        ];

        let bucket = { x: 130, w: 60, h: 20, colorIndex: 0 };
        let items = [];
        let score = 0;
        let frame = 0;
        let targetColorIndex = 0;
        let gameOver = false;

        function setTargetColor() {
            targetColorIndex = Math.floor(Math.random() * COLORS.length);
            const targetElem = document.getElementById("target");
            targetElem.innerText = COLORS[targetColorIndex].name;
            targetElem.style.color = COLORS[targetColorIndex].hex;
        }

        // Move bucket with mouse/touch
        function moveBucket(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            bucket.x = clientX - rect.left - bucket.w / 2;
            if (bucket.x < 0) bucket.x = 0;
            if (bucket.x + bucket.w > canvas.width) bucket.x = canvas.width - bucket.w;
        }

        canvas.addEventListener("mousemove", moveBucket);
        canvas.addEventListener("touchmove", (e) => { e.preventDefault(); moveBucket(e); });
        canvas.addEventListener("click", () => { if (gameOver) resetGame(); });

        function resetGame() {
            score = 0;
            items = [];
            frame = 0;
            gameOver = false;
            document.getElementById("score").innerText = score;
            setTargetColor();
            loop();
        }

        function loop() {
            if (gameOver) return;

            frame++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Bucket
            ctx.fillStyle = COLORS[targetColorIndex].hex;
            ctx.fillRect(bucket.x, canvas.height - bucket.h - 10, bucket.w, bucket.h);

            // Spawn Falling Items
            if (frame % 45 === 0) {
                let colorIdx = Math.floor(Math.random() * COLORS.length);
                items.push({
                    x: Math.random() * (canvas.width - 20),
                    y: -20,
                    size: 20,
                    colorIndex: colorIdx,
                    speed: 3 + Math.floor(score / 5)
                });
            }

            // Update & Draw Items
            for (let i = 0; i < items.length; i++) {
                let item = items[i];
                item.y += item.speed;

                ctx.fillStyle = COLORS[item.colorIndex].hex;
                ctx.beginPath();
                ctx.arc(item.x + 10, item.y + 10, 10, 0, Math.PI * 2);
                ctx.fill();

                // Collision with bucket
                if (
                    item.y + item.size >= canvas.height - bucket.h - 10 &&
                    item.x + item.size >= bucket.x &&
                    item.x <= bucket.x + bucket.w
                ) {
                    if (item.colorIndex === targetColorIndex) {
                        score++;
                        document.getElementById("score").innerText = score;
                        if (window.Arcade && Arcade.addCoins) Arcade.addCoins(1);
                        setTargetColor();
                    } else {
                        gameOver = true;
                    }
                    items.splice(i, 1);
                    i--;
                }
            }

            // Clean up offscreen items
            items = items.filter(item => item.y <= canvas.height);

            if (!gameOver) {
                requestAnimationFrame(loop);
            } else {
                ctx.fillStyle = "white";
                ctx.font = "18px sans-serif";
                ctx.fillText("Game Over! Tap to Restart", 50, canvas.height / 2);
            }
        }

        setTargetColor();
        loop();
    </script>
</body>
</html>
