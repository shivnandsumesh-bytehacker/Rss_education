<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Stacker</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        canvas { background: #1e293b; border: 2px solid #38bdf8; border-radius: 8px; cursor: pointer; }
        .info { font-size: 1.2rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-top: 8px; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="info">Height: <span id="score">0</span></div>
    <canvas id="game" width="300" height="400" onclick="dropBlock()"></canvas>
    <p>Click or Press Space to stack the block</p>
    <a href="index.html">← Back to Hub</a>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let stack = [];
        let currentBlock = { x: 0, y: 360, width: 100, speed: 3, dir: 1 };
        let blockHeight = 20;
        let gameOver = false;
        let score = 0;

        function init() {
            stack = [{ x: 100, y: 380, width: 100 }];
            currentBlock = { x: 0, y: 360, width: 100, speed: 3, dir: 1 };
            score = 0;
            gameOver = false;
            document.getElementById("score").innerText = score;
        }

        function dropBlock() {
            if (gameOver) {
                init();
                return;
            }

            const prevBlock = stack[stack.length - 1];
            const diff = currentBlock.x - prevBlock.x;

            if (Math.abs(diff) >= currentBlock.width) {
                gameOver = true;
                alert("Game Over! Tower Height: " + score);
                return;
            }

            // Calculate overlap width
            const newWidth = currentBlock.width - Math.abs(diff);
            const newX = diff > 0 ? currentBlock.x : prevBlock.x;

            stack.push({ x: newX, y: currentBlock.y, width: newWidth });
            score++;
            document.getElementById("score").innerText = score;

            // Award 1 coin per successful stack
            if (window.Arcade && Arcade.addCoins) Arcade.addCoins(1);

            // Award 5 bonus coins for reaching height 15
            if (score === 15) {
                if (window.Arcade && Arcade.addCoins) Arcade.addCoins(5);
            }

            // Move camera down if reaching upper area
            if (currentBlock.y <= 150) {
                stack.forEach(b => b.y += blockHeight);
            } else {
                currentBlock.y -= blockHeight;
            }

            currentBlock.width = newWidth;
            currentBlock.x = 0;
            currentBlock.speed = Math.min(8, currentBlock.speed + 0.2);
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === " " || e.key === "ArrowDown") dropBlock();
        });

        function update() {
            if (gameOver) return;

            currentBlock.x += currentBlock.speed * currentBlock.dir;
            if (currentBlock.x <= 0 || currentBlock.x + currentBlock.width >= canvas.width) {
                currentBlock.dir *= -1;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw stacked blocks
            stack.forEach((b, i) => {
                ctx.fillStyle = i === 0 ? "#475569" : `hsl(${(i * 25) % 360}, 80%, 60%)`;
                ctx.fillRect(b.x, b.y, b.width, blockHeight - 2);
            });

            // Draw current moving block
            if (!gameOver) {
                ctx.fillStyle = `hsl(${(stack.length * 25) % 360}, 80%, 60%)`;
                ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, blockHeight - 2);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        init();
        gameLoop();
    </script>
</body>
</html>
