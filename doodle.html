<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        canvas { background: #1e293b; border: 2px solid #38bdf8; border-radius: 8px; }
        .info { margin-bottom: 10px; font-size: 1.2rem; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="info">Score: <span id="score">0</span></div>
    <canvas id="game" width="320" height="480"></canvas>
    <a href="index.html">← Back to Hub</a>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let player = { x: 140, y: 300, w: 30, h: 30, vx: 0, vy: 0 };
        let platforms = [];
        let score = 0;
        let highestScore = 0;
        let gameOver = false;
        let keys = {};

        document.addEventListener("keydown", (e) => { keys[e.key] = true; if (gameOver) resetGame(); });
        document.addEventListener("keyup", (e) => { keys[e.key] = false; });

        // Touch control for mobile
        canvas.addEventListener("touchstart", (e) => {
            if (gameOver) { resetGame(); return; }
            let touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            player.vx = touchX < canvas.width / 2 ? -5 : 5;
        });

        function resetGame() {
            player = { x: 140, y: 300, w: 30, h: 30, vx: 0, vy: -8 };
            platforms = [];
            score = 0;
            highestScore = 0;
            gameOver = false;
            document.getElementById("score").innerText = score;

            // Generate initial platforms
            for (let i = 0; i < 7; i++) {
                platforms.push({ x: Math.random() * (canvas.width - 60), y: i * 70 + 50, w: 60, h: 10 });
            }
            loop();
        }

        function loop() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Movement controls
            if (keys["ArrowLeft"] || keys["a"]) player.vx = -5;
            else if (keys["ArrowRight"] || keys["d"]) player.vx = 5;

            player.x += player.vx;
            player.vx *= 0.9; // Friction
            player.vy += 0.3; // Gravity
            player.y += player.vy;

            // Screen wrap around
            if (player.x < -player.w) player.x = canvas.width;
            if (player.x > canvas.width) player.x = -player.w;

            // Platform collision (only falling down)
            if (player.vy > 0) {
                for (let p of platforms) {
                    if (
                        player.x + player.w > p.x &&
                        player.x < p.x + p.w &&
                        player.y + player.h >= p.y &&
                        player.y + player.h <= p.y + 12
                    ) {
                        player.vy = -9; // Bounce
                    }
                }
            }

            // Camera follow / Score tracking
            if (player.y < canvas.height / 2) {
                let diff = canvas.height / 2 - player.y;
                player.y = canvas.height / 2;
                score += Math.floor(diff);

                // Award coins based on score thresholds (every 100 points)
                if (Math.floor(score / 100) > Math.floor(highestScore / 100)) {
                    if (window.Arcade && Arcade.addCoins) Arcade.addCoins(1);
                }
                highestScore = Math.max(highestScore, score);
                document.getElementById("score").innerText = score;

                // Move platforms down
                for (let p of platforms) {
                    p.y += diff;
                    if (p.y > canvas.height) {
                        p.y = 0;
                        p.x = Math.random() * (canvas.width - 60);
                    }
                }
            }

            // Game over check
            if (player.y > canvas.height) {
                gameOver = true;
            }

            // Draw player
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Draw platforms
            ctx.fillStyle = "#22c55e";
            for (let p of platforms) {
                ctx.fillRect(p.x, p.y, p.w, p.h);
            }

            if (!gameOver) {
                requestAnimationFrame(loop);
            } else {
                ctx.fillStyle = "white";
                ctx.font = "18px sans-serif";
                ctx.fillText("Game Over! Tap/Press Key to Restart", 15, canvas.height / 2);
            }
        }

        resetGame();
    </script>
</body>
</html>
