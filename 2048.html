<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(4, 70px); grid-template-rows: repeat(4, 70px); gap: 10px; background: #1e293b; padding: 10px; border-radius: 8px; border: 2px solid #38bdf8; }
        .cell { background: #334155; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: white; }
        .info { margin-bottom: 10px; font-size: 1.2rem; }
        .controls { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; margin-top: 15px; }
        .controls button { width: 50px; height: 50px; font-size: 1.2rem; background: #334155; color: white; border: 1px solid #38bdf8; border-radius: 6px; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="info">Score: <span id="score">0</span></div>
    <div class="grid" id="board"></div>
    <div class="controls">
        <div></div><button onclick="move('up')">▲</button><div></div>
        <button onclick="move('left')">◄</button><button onclick="move('down')">▼</button><button onclick="move('right')">►</button>
    </div>
    <a href="index.html">← Back to Hub</a>

    <script>
        const boardElem = document.getElementById("board");
        let board = Array(16).fill(0);
        let score = 0;

        function init() {
            board = Array(16).fill(0);
            score = 0;
            document.getElementById("score").innerText = score;
            addTile();
            addTile();
            draw();
        }

        function addTile() {
            let empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
            if (empty.length > 0) {
                let idx = empty[Math.floor(Math.random() * empty.length)];
                board[idx] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function draw() {
            boardElem.innerHTML = "";
            const colors = {
                2: "#334155", 4: "#475569", 8: "#f97316", 16: "#ea580c",
                32: "#ef4444", 64: "#dc2626", 128: "#eab308", 256: "#ca8a04",
                512: "#a855f7", 1024: "#9333ea", 2048: "#22c55e"
            };

            board.forEach(val => {
                let cell = document.createElement("div");
                cell.className = "cell";
                cell.innerText = val > 0 ? val : "";
                if (val > 0) {
                    cell.style.background = colors[val] || "#16a34a";
                }
                boardElem.appendChild(cell);
            });
        }

        function slide(row) {
            let arr = row.filter(val => val);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    if (arr[i] >= 2048 && arr[i] % 2048 === 0) {
                        if (window.Arcade && Arcade.addCoins) Arcade.addCoins(5);
                    } else if (arr[i] >= 16) {
                        if (window.Arcade && Arcade.addCoins) Arcade.addCoins(1);
                    }
                    arr[i + 1] = 0;
                }
            }
            arr = arr.filter(val => val);
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function move(dir) {
            let prevBoard = [...board];

            for (let i = 0; i < 4; i++) {
                let row = [];
                for (let j = 0; j < 4; j++) {
                    let idx = (dir === 'up' || dir === 'down') ? (j * 4 + i) : (i * 4 + j);
                    row.push(board[idx]);
                }

                if (dir === 'right' || dir === 'down') row.reverse();
                row = slide(row);
                if (dir === 'right' || dir === 'down') row.reverse();

                for (let j = 0; j < 4; j++) {
                    let idx = (dir === 'up' || dir === 'down') ? (j * 4 + i) : (i * 4 + j);
                    board[idx] = row[j];
                }
            }

            if (JSON.stringify(prevBoard) !== JSON.stringify(board)) {
                addTile();
                document.getElementById("score").innerText = score;
                draw();
                checkGameOver();
            }
        }

        function checkGameOver() {
            if (board.includes(0)) return;
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    let idx = i * 4 + j;
                    if (j < 3 && board[idx] === board[idx + 1]) return;
                    if (i < 3 && board[idx] === board[idx + 4]) return;
                }
            }
            alert("Game Over! Score: " + score);
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" || e.key === "w") move('up');
            if (e.key === "ArrowDown" || e.key === "s") move('down');
            if (e.key === "ArrowLeft" || e.key === "a") move('left');
            if (e.key === "ArrowRight" || e.key === "d") move('right');
        });

        init();
    </script>
</body>
</html>
