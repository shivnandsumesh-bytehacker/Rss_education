<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 Puzzle</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; background: #faf8ef; color: #776e65; font-family: sans-serif; text-align: center; padding: 10px; }
        .ui { font-size: 16px; margin: 10px; display: flex; justify-content: space-around; max-width: 320px; margin: 5px auto; }
        .grid-container { width: 300px; height: 300px; background: #bbada0; border-radius: 6px; margin: 10px auto; padding: 10px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; }
        .tile { width: 60px; height: 60px; background: #cdc1b4; border-radius: 3px; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; color: #776e65; }
        .tile-2 { background: #eee4da; }
        .tile-4 { background: #ede0c8; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 18px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 18px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 18px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 16px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 16px; }
        .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 5px; justify-content: center; margin-top: 15px; }
        .ctrl-btn { width: 60px; height: 50px; font-size: 18px; background: #8f7a66; color: white; border: none; border-radius: 5px; font-weight: bold; }
        a { color: #8f7a66; text-decoration: none; font-size: 16px; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>🧩 2048 Puzzle</h2>
    <div class="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Best: <span id="highScore">0</span></div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="controls">
        <div></div>
        <button class="ctrl-btn" onclick="move('up')">⬆️</button>
        <div></div>
        <button class="ctrl-btn" onclick="move('left')">⬅️</button>
        <button class="ctrl-btn" onclick="move('down')">⬇️</button>
        <button class="ctrl-btn" onclick="move('right')">➡️</button>
    </div>

    <p><a href="index.html">⬅️ Back to Game Hub</a></p>

<script>
let board = Array(16).fill(0);
let score = 0;
let highScore = parseInt(localStorage.getItem("2048_highScore")) || 0;

function init() {
    board = Array(16).fill(0);
    score = 0;
    addTile();
    addTile();
    updateUI();
}

function addTile() {
    let empty = [];
    for (let i = 0; i < 16; i++) {
        if (board[i] === 0) empty.push(i);
    }
    if (empty.length > 0) {
        let rand = empty[Math.floor(Math.random() * empty.length)];
        board[rand] = Math.random() > 0.1 ? 2 : 4;
    }
}

function updateUI() {
    document.getElementById("score").innerText = score;
    document.getElementById("highScore").innerText = highScore;

    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    board.forEach(val => {
        let tile = document.createElement("div");
        tile.className = "tile " + (val > 0 ? `tile-${val}` : "");
        tile.innerText = val > 0 ? val : "";
        grid.appendChild(tile);
    });
}

function slideRow(row) {
    let filtered = row.filter(val => val !== 0);
    for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
            filtered[i] *= 2;
            score += filtered[i];
            filtered[i + 1] = 0;
        }
    }
    filtered = filtered.filter(val => val !== 0);
    while (filtered.length < 4) filtered.push(0);
    return filtered;
}

function move(dir) {
    let prevBoard = [...board];

    for (let i = 0; i < 4; i++) {
        let row = [];
        for (let j = 0; j < 4; j++) {
            let idx = (dir === 'up' || dir === 'down') ? (j * 4 + i) : (i * 4 + j);
            row.push(board[idx]);
        }

        if (dir === 'right' || dir === 'down') row.reverse();
        row = slideRow(row);
        if (dir === 'right' || dir === 'down') row.reverse();

        for (let j = 0; j < 4; j++) {
            let idx = (dir === 'up' || dir === 'down') ? (j * 4 + i) : (i * 4 + j);
            board[idx] = row[j];
        }
    }

    if (JSON.stringify(prevBoard) !== JSON.stringify(board)) {
        addTile();
        if (score > highScore) {
            highScore = score;
            localStorage.setItem("2048_highScore", highScore);
        }
        updateUI();
        checkGameOver();
    }
}

function checkGameOver() {
    if (board.includes(0)) return;
    for (let i = 0; i < 16; i++) {
        if (i % 4 !== 3 && board[i] === board[i + 1]) return;
        if (i < 12 && board[i] === board[i + 4]) return;
    }
    alert("Game Over! Restarting game.");
    init();
}

// Swipe Support for iPad
let touchStartX = 0, touchStartY = 0;
document.addEventListener("touchstart", e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
});

document.addEventListener("touchend", e => {
    let dx = e.changedTouches[0].clientX - touchStartX;
    let dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) move('right');
        else if (dx < -30) move('left');
    } else {
        if (dy > 30) move('down');
        else if (dy < -30) move('up');
    }
});

init();
</script>
</body>
</html>
