<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        canvas { background: #020617; border: 2px solid #38bdf8; border-radius: 8px; }
        .info { font-size: 1.2rem; margin-bottom: 10px; }
        .controls { display: flex; gap: 15px; margin-top: 15px; }
        .controls button { padding: 10px 20px; font-size: 1.1rem; background: #334155; color: white; border: 1px solid #38bdf8; border-radius: 6px; cursor: pointer; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="info">Score: <span id="score">0</span></div>
    <canvas id="game" width="360" height="400"></canvas>
    <div class="controls">
        <button onclick="movePlayer(-15)">◄</button>
        <button onclick="shoot()">Shoot</button>
        <button onclick="movePlayer(15)">►</button>
    </div>
    <a href="index.html">← Back to Hub</a>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let player = { x: 160, y: 360, w: 40, h: 15 };
        let bullets = [];
        let enemies = [];
        let enemyDirection = 1;
        let gameOver = false;

        function createEnemies() {
            enemies = [];
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 6; col++) {
                    enemies.push({ x: 30 + col * 50, y: 30 + row * 35, w: 30, h: 20, alive: true });
                }
            }
        }

        function movePlayer(dx) {
            if (gameOver) return;
            player.x = Math.max(0, Math.min(canvas.width - player.w, player.x + dx));
        }

        function shoot() {
            if (gameOver) return;
            bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 10 });
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") movePlayer(-15);
            if (e.key === "ArrowRight" || e.key === "d") movePlayer(15);
            if (e.key === " " || e.key === "ArrowUp" || e.key === "w") shoot();
        });

        function update() {
            if (gameOver) return;

            // Update bullets
            bullets.forEach((b, index) => {
                b.y -= 5;
                if (b.y < 0) bullets.splice(index, 1);
            });

            // Move enemies
            let shiftDown = false;
            let aliveEnemies = enemies.filter(e => e.alive);

            aliveEnemies.forEach(e => {
                if ((e.x + e.w >= canvas.width && enemyDirection > 0) || (e.x <= 0 && enemyDirection < 0)) {
                    shiftDown = true;
                }
            });

            if (shiftDown) {
                enemyDirection *= -1;
                aliveEnemies.forEach(e => {
                    e.y += 15;
                    if (e.y + e.h >= player.y) {
                        gameOver = true;
                        alert("Game Over! Score: " + score);
                    }
                });
            } else {
                aliveEnemies.forEach(e => {
                    e.x += enemyDirection * 1.2;
                });
            }

            // Bullet collision with enemies
            bullets.forEach((b, bIndex) => {
                enemies.forEach(e => {
                    if (e.alive && b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                        e.alive = false;
                        bullets.splice(bIndex, 1);
                        score += 10;
                        document.getElementById("score").innerText = score;

                        if (window.Arcade && Arcade.addCoins) Arcade.addCoins(1);

                        // Check if all enemies defeated
                        if (enemies.every(enemy => !enemy.alive)) {
                            if (window.Arcade && Arcade.addCoins) Arcade.addCoins(5);
                            setTimeout(() => {
                                alert("Wave Cleared! Starting next wave...");
                                createEnemies();
                            }, 200);
                        }
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Player
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Draw Bullets
            ctx.fillStyle = "#facc15";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

            // Draw Enemies
            ctx.fillStyle = "#ef4444";
            enemies.forEach(e => {
                if (e.alive) ctx.fillRect(e.x, e.y, e.w, e.h);
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        createEnemies();
        gameLoop();
    </script>
</body>
</html>
