<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Runner</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        canvas { background: #1e293b; border: 2px solid #38bdf8; border-radius: 8px; }
        .info { margin-bottom: 10px; font-size: 1.2rem; }
        .controls { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; margin-top: 10px; }
        .controls button { width: 50px; height: 50px; font-size: 1.2rem; background: #334155; color: white; border: 1px solid #38bdf8; border-radius: 6px; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="info">Mazes Cleared: <span id="score">0</span></div>
    <canvas id="game" width="300" height="300"></canvas>
    <div class="controls">
        <div></div><button onclick="movePlayer(0,-1)">▲</button><div></div>
        <button onclick="movePlayer(-1,0)">◄</button><button onclick="movePlayer(0,1)">▼</button><button onclick="movePlayer(1,0)">►</button>
    </div>
    <a href="index.html">← Back to Hub</a>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const cols = 10, rows = 10;
        const size = 30;
        let grid = [];
        let player = { x: 0, y: 0 };
        let goal = { x: cols - 1, y: rows - 1 };
        let score = 0;

        class Cell {
            constructor(r, c) {
                this.r = r;
                this.c = c;
                this.walls = [true, true, true, true]; // Top, Right, Bottom, Left
                this.visited = false;
            }
        }

        function generateMaze() {
            grid = [];
            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    row.push(new Cell(r, c));
                }
                grid.push(row);
            }

            let stack = [];
            let current = grid[0][0];
            current.visited = true;

            do {
                let neighbors = getUnvisitedNeighbors(current);
                if (neighbors.length > 0) {
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    removeWalls(current, next);
                    stack.push(current);
                    current = next;
                    current.visited = true;
                } else if (stack.length > 0) {
                    current = stack.pop();
                }
            } while (stack.length > 0);

            player = { x: 0, y: 0 };
            draw();
        }

        function getUnvisitedNeighbors(cell) {
            let neighbors = [];
            let { r, c } = cell;

            if (r > 0 && !grid[r - 1][c].visited) neighbors.push(grid[r - 1][c]);
            if (c < cols - 1 && !grid[r][c + 1].visited) neighbors.push(grid[r][c + 1]);
            if (r < rows - 1 && !grid[r + 1][c].visited) neighbors.push(grid[r + 1][c]);
            if (c > 0 && !grid[r][c - 1].visited) neighbors.push(grid[r][c - 1]);

            return neighbors;
        }

        function removeWalls(a, b) {
            let x = a.c - b.c;
            if (x === 1) { a.walls[3] = false; b.walls[1] = false; }
            else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }

            let y = a.r - b.r;
            if (y === 1) { a.walls[0] = false; b.walls[2] = false; }
            else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
        }

        function movePlayer(dx, dy) {
            let current = grid[player.y][player.x];
            if (dx === 0 && dy === -1 && !current.walls[0]) player.y--;
            if (dx === 1 && dy === 0 && !current.walls[1]) player.x++;
            if (dx === 0 && dy === 1 && !current.walls[2]) player.y++;
            if (dx === -1 && dy === 0 && !current.walls[3]) player.x--;

            if (player.x === goal.x && player.y === goal.y) {
                score++;
                document.getElementById("score").innerText = score;
                if (window.Arcade && Arcade.addCoins) Arcade.addCoins(5);
                generateMaze();
            } else {
                draw();
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" || e.key === "w") movePlayer(0, -1);
            if (e.key === "ArrowRight" || e.key === "d") movePlayer(1, 0);
            if (e.key === "ArrowDown" || e.key === "s") movePlayer(0, 1);
            if (e.key === "ArrowLeft" || e.key === "a") movePlayer(-1, 0);
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let x = c * size;
                    let y = r * size;
                    let cell = grid[r][c];

                    if (cell.walls[0]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + size, y); ctx.stroke(); }
                    if (cell.walls[1]) { ctx.beginPath(); ctx.moveTo(x + size, y); ctx.lineTo(x + size, y + size); ctx.stroke(); }
                    if (cell.walls[2]) { ctx.beginPath(); ctx.moveTo(x + size, y + size); ctx.lineTo(x, y + size); ctx.stroke(); }
                    if (cell.walls[3]) { ctx.beginPath(); ctx.moveTo(x, y + size); ctx.lineTo(x, y); ctx.stroke(); }
                }
            }

            // Draw Goal
            ctx.fillStyle = "#22c55e";
            ctx.fillRect(goal.x * size + 4, goal.y * size + 4, size - 8, size - 8);

            // Draw Player
            ctx.fillStyle = "#ef4444";
            ctx.fillRect(player.x * size + 6, player.y * size + 6, size - 12, size - 12);
        }

        generateMaze();
    </script>
</body>
</html>
