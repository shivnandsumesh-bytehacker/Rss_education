<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        canvas { background: #70c5ce; border: 2px solid #38bdf8; border-radius: 8px; }
        .info { margin-bottom: 10px; font-size: 1.2rem; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="info">Score: <span id="score">0</span></div>
    <canvas id="game" width="320" height="480"></canvas>
    <a href="index.html">← Back to Hub</a>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let bird = { x: 50, y: 150, w: 20, h: 20, gravity: 0.25, jump: -4.6, velocity: 0 };
        let pipes = [];
        let frame = 0;
        let score = 0;
        let gameOver = false;

        function jump() {
            if (gameOver) {
                resetGame();
            } else {
                bird.velocity = bird.jump;
            }
        }

        document.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
        canvas.addEventListener("click", jump);

        function resetGame() {
            bird.y = 150;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frame = 0;
            gameOver = false;
            document.getElementById("score").innerText = score;
            loop();
        }

        function loop() {
            if (gameOver) return;

            frame++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Bird physics
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Draw Bird
            ctx.fillStyle = "#fbbf24";
            ctx.fillRect(bird.x, bird.y, bird.w, bird.h);

            // Floor/Ceiling collision
            if (bird.y + bird.h >= canvas.height || bird.y <= 0) {
                gameOver = true;
            }

            // Spawn Pipes
            if (frame % 100 === 0) {
                let gap = 120;
                let topH = Math.floor(Math.random() * (canvas.height - gap - 100)) + 30;
                pipes.push({ x: canvas.width, top: topH, bottom: canvas.height - topH - gap, passed: false });
            }

            // Move and draw pipes
            ctx.fillStyle = "#22c55e";
            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];
                p.x -= 2;

                ctx.fillRect(p.x, 0, 40, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, 40, p.bottom);

                // Collision Check
                if (
                    bird.x < p.x + 40 &&
                    bird.x + bird.w > p.x &&
                    (bird.y < p.top || bird.y + bird.h > canvas.height - p.bottom)
                ) {
                    gameOver = true;
                }

                // Pass pipe & award coin
                if (p.x + 40 < bird.x && !p.passed) {
                    p.passed = true;
                    score++;
                    document.getElementById("score").innerText = score;
                    if (window.Arcade && Arcade.addCoins) Arcade.addCoins(1);
                }
            }

            // Clean up off-screen pipes
            pipes = pipes.filter(p => p.x > -40);

            if (!gameOver) {
                requestAnimationFrame(loop);
            } else {
                ctx.fillStyle = "white";
                ctx.font = "20px sans-serif";
                ctx.fillText("Game Over! Tap/Space to Restart", 15, canvas.height / 2);
            }
        }

        loop();
    </script>
</body>
</html>
