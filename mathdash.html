<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Dash</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; border: 2px solid #38bdf8; border-radius: 12px; padding: 24px; width: 300px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .problem { font-size: 2.2rem; margin: 20px 0; font-weight: bold; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { background: #334155; color: white; border: 2px solid #38bdf8; padding: 12px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0284c7; }
        .info { font-size: 1.1rem; margin-bottom: 15px; display: flex; justify-content: space-between; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <div class="info">
            <span>Score: <span id="score">0</span></span>
            <span>Time: <span id="timer">10</span>s</span>
        </div>
        <div class="problem" id="problem">2 + 2 = ?</div>
        <div class="options" id="options"></div>
    </div>
    <a href="index.html">← Back to Hub</a>

    <script>
        let score = 0;
        let correctAnswer = 0;
        let timeLeft = 10;
        let timerInterval = null;
        let gameOver = false;

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 10;
            document.getElementById("timer").innerText = timeLeft;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function generateProblem() {
            let num1 = Math.floor(Math.random() * 12) + 1;
            let num2 = Math.floor(Math.random() * 12) + 1;
            let operations = ['+', '-', '*'];
            let op = operations[Math.floor(Math.random() * operations.length)];

            if (op === '+') correctAnswer = num1 + num2;
            if (op === '-') {
                if (num1 < num2) [num1, num2] = [num2, num1];
                correctAnswer = num1 - num2;
            }
            if (op === '*') correctAnswer = num1 * num2;

            document.getElementById("problem").innerText = `${num1} ${op} ${num2} = ?`;

            let answers = [correctAnswer];
            while (answers.length < 4) {
                let wrong = correctAnswer + (Math.floor(Math.random() * 10) - 5);
                if (wrong >= 0 && !answers.includes(wrong)) {
                    answers.push(wrong);
                }
            }

            answers.sort(() => Math.random() - 0.5);

            const optionsElem = document.getElementById("options");
            optionsElem.innerHTML = "";
            answers.forEach(ans => {
                let btn = document.createElement("button");
                btn.innerText = ans;
                btn.onclick = () => checkAnswer(ans);
                optionsElem.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            if (gameOver) return;

            if (selected === correctAnswer) {
                score++;
                document.getElementById("score").innerText = score;
                if (window.Arcade && Arcade.addCoins) Arcade.addCoins(1);
                startTimer();
                generateProblem();
            } else {
                endGame();
            }
        }

        function endGame() {
            gameOver = true;
            clearInterval(timerInterval);
            document.getElementById("problem").innerText = "Game Over!";
            const optionsElem = document.getElementById("options");
            optionsElem.innerHTML = `<button onclick="resetGame()" style="grid-column: span 2;">Play Again</button>`;
        }

        function resetGame() {
            score = 0;
            gameOver = false;
            document.getElementById("score").innerText = score;
            startTimer();
            generateProblem();
        }

        startTimer();
        generateProblem();
    </script>
</body>
</html>
