<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        canvas { background: #1e293b; border: 2px solid #38bdf8; border-radius: 8px; }
        .score { font-size: 1.5rem; margin-bottom: 10px; }
        .controls { display: flex; gap: 20px; margin-top: 10px; }
        .controls button { width: 60px; height: 40px; font-size: 1.2rem; background: #334155; color: white; border: 1px solid #38bdf8; border-radius: 6px; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="score">Player: <span id="pScore">0</span> | AI: <span id="aiScore">0</span></div>
    <canvas id="game" width="400" height="300"></canvas>
    <div class="controls">
        <button onclick="movePlayer(-20)">▲</button>
        <button onclick="movePlayer(20)">▼</button>
    </div>
    <a href="index.html">← Back to Hub</a>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const paddleWidth = 10, paddleHeight = 60;
        let playerY = canvas.height / 2 - paddleHeight / 2;
        let aiY = canvas.height / 2 - paddleHeight / 2;
        let ballX = canvas.width / 2, ballY = canvas.height / 2;
        let ballSpeedX = 4, ballSpeedY = 3;
        let playerScore = 0, aiScore = 0;

        function movePlayer(dy) {
            playerY = Math.max(0, Math.min(canvas.height - paddleHeight, playerY + dy));
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" || e.key === "w") movePlayer(-20);
            if (e.key === "ArrowDown" || e.key === "s") movePlayer(20);
        });

        function resetBall() {
            ballX = canvas.width / 2;
            ballY = canvas.height / 2;
            ballSpeedX = -ballSpeedX;
            ballSpeedY = (Math.random() - 0.5) * 6;
        }

        function update() {
            ballX += ballSpeedX;
            ballY += ballSpeedY;

            // Ball collision top/bottom
            if (ballY <= 0 || ballY >= canvas.height) {
                ballSpeedY = -ballSpeedY;
            }

            // AI movement
            if (aiY + paddleHeight / 2 < ballY - 10) aiY += 3;
            else if (aiY + paddleHeight / 2 > ballY + 10) aiY -= 3;
            aiY = Math.max(0, Math.min(canvas.height - paddleHeight, aiY));

            // Player collision
            if (ballX <= paddleWidth && ballY >= playerY && ballY <= playerY + paddleHeight) {
                ballSpeedX = -ballSpeedX * 1.05;
                ballX = paddleWidth;
            }

            // AI collision
            if (ballX >= canvas.width - paddleWidth && ballY >= aiY && ballY <= aiY + paddleHeight) {
                ballSpeedX = -ballSpeedX * 1.05;
                ballX = canvas.width - paddleWidth;
            }

            // Scoring
            if (ballX < 0) {
                aiScore++;
                document.getElementById("aiScore").innerText = aiScore;
                resetBall();
            } else if (ballX > canvas.width) {
                playerScore++;
                document.getElementById("pScore").innerText = playerScore;
                if (window.Arcade && Arcade.addCoins) Arcade.addCoins(1);

                if (playerScore >= 5) {
                    if (window.Arcade && Arcade.addCoins) Arcade.addCoins(5);
                    alert("You Win!");
                    playerScore = 0;
                    aiScore = 0;
                    document.getElementById("pScore").innerText = playerScore;
                    document.getElementById("aiScore").innerText = aiScore;
                }
                resetBall();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Center line
            ctx.strokeStyle = "#334155";
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Player paddle
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(0, playerY, paddleWidth, paddleHeight);

            // AI paddle
            ctx.fillStyle = "#ef4444";
            ctx.fillRect(canvas.width - paddleWidth, aiY, paddleWidth, paddleHeight);

            // Ball
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ballX, ballY, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
