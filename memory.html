<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(4, 70px); gap: 10px; background: #1e293b; padding: 15px; border-radius: 8px; border: 2px solid #38bdf8; }
        .card { width: 70px; height: 70px; background: #334155; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; user-select: none; transition: transform 0.2s; }
        .card.flipped { background: #0284c7; }
        .card.matched { background: #22c55e; cursor: default; }
        .info { margin-bottom: 15px; font-size: 1.2rem; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="info">Matches: <span id="matches">0</span> / 8</div>
    <div class="grid" id="grid"></div>
    <a href="index.html">← Back to Hub</a>

    <script>
        const symbols = ['🍎', '🍌', '🍒', '🍇', '🍉', '🍓', '🍍', '🥝'];
        let cards = [...symbols, ...symbols];
        let flippedCards = [];
        let matchedPairs = 0;
        let lockBoard = false;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function createBoard() {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            shuffle(cards);
            matchedPairs = 0;
            document.getElementById("matches").innerText = matchedPairs;

            cards.forEach((symbol, index) => {
                const card = document.createElement("div");
                card.className = "card";
                card.dataset.symbol = symbol;
                card.dataset.index = index;
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (lockBoard || card.classList.contains("flipped") || card.classList.contains("matched")) return;

            card.classList.add("flipped");
            card.innerText = card.dataset.symbol;
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            lockBoard = true;
            const [card1, card2] = flippedCards;

            if (card1.dataset.symbol === card2.dataset.symbol) {
                card1.classList.add("matched");
                card2.classList.add("matched");
                matchedPairs++;
                document.getElementById("matches").innerText = matchedPairs;

                if (window.Arcade && Arcade.addCoins) Arcade.addCoins(2);

                flippedCards = [];
                lockBoard = false;

                if (matchedPairs === symbols.length) {
                    setTimeout(() => {
                        if (window.Arcade && Arcade.addCoins) Arcade.addCoins(5);
                        alert("Congratulations! You cleared the board!");
                        createBoard();
                    }, 300);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove("flipped");
                    card2.classList.remove("flipped");
                    card1.innerText = "";
                    card2.innerText = "";
                    flippedCards = [];
                    lockBoard = false;
                }, 800);
            }
        }

        createBoard();
    </script>
</body>
</html>
