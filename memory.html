<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Memory Match Deluxe</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; background: #181824; color: white; font-family: sans-serif; text-align: center; padding: 10px; }
        .ui { font-size: 16px; margin: 10px; display: flex; justify-content: space-around; max-width: 320px; margin: 5px auto; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 320px; margin: 15px auto; }
        .card { width: 70px; height: 70px; background: #2a2a40; border: 2px solid #555; border-radius: 10px; font-size: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .card.flipped { background: #3d3d60; border-color: #00BCD4; }
        .shop { background: #222235; padding: 10px; max-width: 320px; margin: 10px auto; border-radius: 8px; border: 1px solid #444; }
        button { padding: 8px 12px; font-size: 13px; font-weight: bold; background: #00BCD4; color: #000; border: none; border-radius: 5px; margin: 3px; cursor: pointer; }
        button:disabled { background: #444; color: #888; }
        a { color: #00BCD4; text-decoration: none; font-size: 16px; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>🃏 Memory Match</h2>
    <div class="ui">
        <div>Moves: <span id="moves">0</span></div>
        <div>Coins: $<span id="coins">0</span></div>
        <div>Best: <span id="highScore">--</span></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="shop">
        <h3>Theme Shop</h3>
        <button onclick="setTheme('animals')">🐶 Animals</button>
        <button id="sportsBtn" onclick="buyTheme('sports', 15)">⚽ Sports ($15)</button>
        <button id="spaceBtn" onclick="buyTheme('space', 30)">🚀 Space ($30)</button>
    </div>

    <p><a href="index.html">⬅️ Back to Game Hub</a></p>

<script>
const themes = {
    animals: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'],
    sports: ['⚽', '🏀', '🏈', '⚾', '🎾', '🏐', '🏉', '🎱'],
    space: ['🚀', '🛸', '🌕', '🪐', '⭐', '👾', '👨‍🚀', '☄️']
};

let coins = parseInt(localStorage.getItem("mem_coins")) || 0;
let highScore = parseInt(localStorage.getItem("mem_highScore")) || 999;
let currentTheme = localStorage.getItem("mem_theme") || "animals";
let unlockedSports = localStorage.getItem("mem_sports") === "true";
let unlockedSpace = localStorage.getItem("mem_space") === "true";

let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let moves = 0;
let lockBoard = false;

function updateUI() {
    document.getElementById("coins").innerText = coins;
    document.getElementById("highScore").innerText = highScore === 999 ? "--" : highScore;
    document.getElementById("moves").innerText = moves;

    document.getElementById("sportsBtn").innerText = unlockedSports ? "⚽ Sports" : "⚽ Sports ($15)";
    document.getElementById("sportsBtn").disabled = !unlockedSports && coins < 15;

    document.getElementById("spaceBtn").innerText = unlockedSpace ? "🚀 Space" : "🚀 Space ($30)";
    document.getElementById("spaceBtn").disabled = !unlockedSpace && coins < 30;
}

function setTheme(t) {
    if (t === 'sports' && !unlockedSports) return;
    if (t === 'space' && !unlockedSpace) return;
    currentTheme = t;
    localStorage.setItem("mem_theme", t);
    initGame();
}

function buyTheme(t, cost) {
    if ((t === 'sports' && unlockedSports) || (t === 'space' && unlockedSpace)) {
        return setTheme(t);
    }
    if (coins >= cost) {
        coins -= cost;
        if (t === 'sports') unlockedSports = true;
        if (t === 'space') unlockedSpace = true;
        localStorage.setItem("mem_coins", coins);
        localStorage.setItem("mem_" + t, "true");
        setTheme(t);
    }
}

function initGame() {
    moves = 0;
    matchedPairs = 0;
    flippedCards = [];
    lockBoard = false;
    updateUI();

    let icons = [...themes[currentTheme], ...themes[currentTheme]];
    icons.sort(() => Math.random() - 0.5);

    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    cards = icons.map((icon, index) => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.icon = icon;
        card.dataset.index = index;
        card.innerText = "❓";
        card.addEventListener("click", () => flipCard(card));
        grid.appendChild(card);
        return card;
    });
}

function flipCard(card) {
    if (lockBoard || card.classList.contains("flipped") || flippedCards.includes(card)) return;

    card.classList.add("flipped");
    card.innerText = card.dataset.icon;
    flippedCards.push(card);

    if (flippedCards.length === 2) {
        moves++;
        updateUI();
        checkMatch();
    }
}

function checkMatch() {
    const [c1, c2] = flippedCards;
    if (c1.dataset.icon === c2.dataset.icon) {
        matchedPairs++;
        flippedCards = [];
        if (matchedPairs === 8) {
            coins += 10;
            localStorage.setItem("mem_coins", coins);
            if (moves < highScore) {
                highScore = moves;
                localStorage.setItem("mem_highScore", highScore);
            }
            setTimeout(() => {
                alert(`🎉 You Won in ${moves} moves! Earned 10 coins.`);
                initGame();
            }, 300);
        }
    } else {
        lockBoard = true;
        setTimeout(() => {
            c1.classList.remove("flipped");
            c2.classList.remove("flipped");
            c1.innerText = "❓";
            c2.innerText = "❓";
            flippedCards = [];
            lockBoard = false;
        }, 800);
    }
}

initGame();
</script>
</body>
</html>
