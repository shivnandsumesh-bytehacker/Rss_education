<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <script src="arcade.js"></script>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(2, 110px); gap: 15px; margin: 20px 0; }
        .btn { width: 110px; height: 110px; border-radius: 12px; cursor: pointer; opacity: 0.6; transition: opacity 0.2s, transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn.active { opacity: 1; filter: brightness(1.3); }
        #green { background: #22c55e; }
        #red { background: #ef4444; }
        #yellow { background: #eab308; }
        #blue { background: #3b82f6; }
        .info { font-size: 1.2rem; }
        button.start-btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        a { color: #38bdf8; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="info">Level: <span id="level">0</span></div>
    <div class="grid">
        <div id="green" class="btn" onclick="handleClick(0)"></div>
        <div id="red" class="btn" onclick="handleClick(1)"></div>
        <div id="yellow" class="btn" onclick="handleClick(2)"></div>
        <div id="blue" class="btn" onclick="handleClick(3)"></div>
    </div>
    <button class="start-btn" onclick="startGame()">Start Game</button>
    <a href="index.html">← Back to Hub</a>

    <script>
        const colors = ["green", "red", "yellow", "blue"];
        let sequence = [];
        let playerSequence = [];
        let level = 0;
        let isPlaying = false;
        let acceptingInput = false;

        function startGame() {
            sequence = [];
            playerSequence = [];
            level = 0;
            isPlaying = true;
            nextRound();
        }

        function nextRound() {
            playerSequence = [];
            level++;
            document.getElementById("level").innerText = level;
            sequence.push(Math.floor(Math.random() * 4));
            playSequence();
        }

        function playSequence() {
            acceptingInput = false;
            let i = 0;
            const interval = setInterval(() => {
                flashButton(sequence[i]);
                i++;
                if (i >= sequence.length) {
                    clearInterval(interval);
                    acceptingInput = true;
                }
            }, 600);
        }

        function flashButton(index) {
            const btn = document.getElementById(colors[index]);
            btn.classList.add("active");
            setTimeout(() => {
                btn.classList.remove("active");
            }, 300);
        }

        function handleClick(index) {
            if (!isPlaying || !acceptingInput) return;

            flashButton(index);
            playerSequence.push(index);

            const currentIndex = playerSequence.length - 1;
            if (playerSequence[currentIndex] !== sequence[currentIndex]) {
                alert("Game Over! You reached level " + level);
                isPlaying = false;
                acceptingInput = false;
                return;
            }

            // Award 1 coin for every correct button pressed
            if (window.Arcade && Arcade.addCoins) Arcade.addCoins(1);

            if (playerSequence.length === sequence.length) {
                if (level === 10) {
                    if (window.Arcade && Arcade.addCoins) Arcade.addCoins(5);
                }
                acceptingInput = false;
                setTimeout(nextRound, 800);
            }
        }
    </script>
</body>
</html>
